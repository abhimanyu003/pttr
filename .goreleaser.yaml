project_name: "pttr"
version: 2
# before are hooks that will be run before any builds are done, so good to put install scripts and stuff that your builds need here
before:
  hooks:
    # Remove unused packaged from the build process
    - go mod tidy
    - go generate

builds:
  - main: ./main.go
    binary: pttr
    goos: ["linux", "darwin", "windows", "freebsd"]
    goarch: ["386", "amd64", "arm64"]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X "main.version={{.Version}}"
    env:
      - CGO_ENABLED=0

universal_binaries:
  - replace: true

archives:
  - formats: ["tar.gz"]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: ["zip"]

changelog:
  sort: "asc"
  filters:
    exclude: ["^docs:", "demo", "^hugo:", "Merge pull request", "Merge branch"]

brews:
  - repository:
      owner: abhimanyu003
      name: homebrew-tap
    name: pttr
    homepage: "https://github.com/abhimanyu003/pttr"
    description: "A cross-platform terminal UI application for viewing and managing open ports - process on your system."
    license: "MIT"
    skip_upload: auto
    commit_author:
      name: abhimanyu003
      email: abhimanyusharma003@gmail.com
    directory: Formula
    install: |-
      bin.install "pttr"
    test: |
      system "#{bin}/pttr -v"

scoops:
  - repository:
      owner: abhimanyu003
      name: scoop-bucket
      token: "{{ .Env.GITHUB_TOKEN }}"
    name: pttr
    homepage: "https://github.com/abhimanyu003/pttr"
    description: "pttr is command line software that allows you to quickly run various transformation operations on the string."
    license: "MIT"

nfpms:
  - ids:
      - pttr
    vendor: abhimanyu003
    homepage: "https://github.com/abhimanyu003/pttr"
    maintainer: "Abhimanyu Sharma <abhimanyusharma003@gmail.com>"
    description: "A cross-platform terminal UI application for viewing and managing open ports - process on your system"
    license: MIT
    formats:
      - deb
      - rpm
      - archlinux
      - termux.deb
    bindir: /usr/bin

snapcrafts:
  - name: pttr
    publish: true
    summary: A cross-platform terminal UI application for viewing and managing open ports - process on your system.
    description: |
      pttr is command line software that allows you to quickly run various transformation operations on the string.
    grade: stable
    confinement: strict
    license: MIT
    base: core20
    channel_templates:
      - stable
    apps:
      pttr:
        plugs: ["home", "network"]

aurs:
  - name: pttr-bin
    homepage: "https://github.com/abhimanyu003/pttr"
    description: "pttr is command line software that allows you to quickly run various transformation operations on the string."
    maintainers:
      - "Abhimanyu Sharma <abhimanyusharma003@gmail.com>"
    license: "MIT"
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/pttr-bin.git"
    commit_author:
      name: Abhimanyu Sharma
      email: abhimanyusharma003@gmail.com

sboms:
  - artifacts: archive
  
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    output: true
    artifacts: checksum
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

winget:
  - name: pttr
    publisher: abhimanyu003
    publisher_url: https://github.com/abhimanyu003
    short_description: A cross-platform terminal UI application for viewing and managing open ports - process on your system.
    license: MIT
    commit_author:
      name: Abhimanyu Sharma
      email: abhimanyusharma003@gmail.com
    homepage: https://github.com/abhimanyu003/pttr
    license_url: https://github.com/abhimanyu003/pttr/blob/master/LICENSE
    copyright: Copyright (c) 2025-{{ .Now.Format "2006" }} Abhimanyu Sharma
    release_notes: "{{ .Changelog }}"
    release_notes_url: https://github.com/abhimanyu003/pttr/releases/tag/{{ .Tag }}
    tags:
      - cli
      - tui
      - portManger
      - processManager
      - port
      - process
      - devutil
      - productivity
    author: Abhimanyu Sharma
    publisher_support_url: https://github.com/abhimanyu003/pttr/issues
    repository:
      owner: abhimanyu003
      name: winget-pkgs
      branch: pttr-{{ .Version }}
      token: "{{ .Env.GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

